<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Soloist — MusicFluid</title>
<meta name="theme-color" content="#0b0b10">
<style>
:root {
    --bg: #0b0b10;
    --panel: #15151d;
    --panel-2: #1c1c26;
    --line: #2a2a36;
    --text: #ececf2;
    --dim: #9a9aab;
    --green: #1db954;
    --red: #e0525f;
    --accent: var(--green);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

/* ------------------------------- top bar ------------------------------- */
header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
}
.brand { font-weight: 600; letter-spacing: .02em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: 0 0 auto; }
.dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.warn { background: #d8a13a; }
#device { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .spacer { flex: 1; }
header button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 12px;
}
header button:hover { border-color: #3c3c4c; }
header button.on { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 600; }

/* -------------------------------- body --------------------------------- */
main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    overflow: hidden;
}
@media (min-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr) 300px; }
}
#now {
    padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
    overflow-y: auto;
    min-height: 0;
}
#art-wrap {
    width: min(46vh, 100%, 380px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: var(--panel-2) center/cover no-repeat;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    flex: 0 0 auto;
    display: grid; place-items: center;
    color: var(--dim); font-size: 12px;
    overflow: hidden;
}
#art { width: 100%; height: 100%; object-fit: cover; display: none; }
.meta { text-align: center; width: 100%; min-width: 0; }
#title { font-size: 19px; font-weight: 650; margin: 0 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#artist { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#album, #context { color: #74748a; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* seek + volume use native range inputs */
.bar-row { width: 100%; max-width: 460px; }
.times { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 20px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) calc(var(--pct, 0) * 1%), var(--line) 0);
}
input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) calc(var(--pct, 0) * 1%), var(--line) 0);
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%; background: var(--text);
    margin-top: -4px; border: 0;
}
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 0; }
input[type=range]:disabled { opacity: .4; }

.controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
.controls button {
    background: none; border: 0; color: var(--text);
    font-size: 20px; line-height: 1; padding: 8px; border-radius: 50%;
    opacity: .85;
}
.controls button:hover { opacity: 1; }
.controls button.toggle { font-size: 15px; opacity: .5; filter: grayscale(1); }
.controls button.toggle.on { opacity: 1; filter: none; }
#btn-play {
    background: var(--text); color: #0b0b10;
    width: 52px; height: 52px; font-size: 20px;
    display: grid; place-items: center; opacity: 1;
}
#btn-play:hover { transform: scale(1.05); }
.vol-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 240px; }
.vol-row span { color: var(--dim); font-size: 13px; }
#vol-val { font-size: 11px; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }

/* -------------------------------- side --------------------------------- */
aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
aside h2 {
    margin: 0; padding: 12px 14px 8px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    font-weight: 600;
}
#queue { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 8px; min-height: 90px; }
.qrow { display: flex; gap: 9px; align-items: center; padding: 6px; border-radius: 6px; }
.qrow:hover { background: var(--panel-2); }
.qrow img { width: 36px; height: 36px; border-radius: 4px; background: var(--panel-2); object-fit: cover; flex: 0 0 auto; }
.qrow .qt { min-width: 0; }
.qrow .qn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.qrow .qa { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--dim); }
.empty { color: #6a6a7c; font-size: 12px; padding: 10px 6px; }

.uri-box { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.uri-box input {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; width: 100%; outline: none;
}
.uri-box input:focus { border-color: #3c3c4c; }
.uri-box .row { display: flex; gap: 6px; }
.uri-box .row button {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px; font-size: 12px;
}
.uri-box .row button.primary { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 600; }

footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 7px 14px;
    font-size: 11px; color: var(--dim);
    display: flex; gap: 10px; align-items: center;
    background: var(--panel);
}
#msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#msg.err { color: var(--red); }
</style>
</head>
<body>

<header>
    <span class="dot" id="conn-dot"></span>
    <span class="brand">Soloist</span>
    <span id="device">not connected</span>
    <span class="spacer"></span>
    <button id="btn-activate" title="Make Soloist the active Connect device">Activate</button>
    <button id="btn-reconnect" title="Reconnect the WebSocket">Reconnect</button>
</header>

<main>
    <section id="now">
        <div id="art-wrap"><img id="art" alt=""><span id="art-ph">no artwork</span></div>

        <div class="meta">
            <h1 id="title">Nothing playing</h1>
            <div id="artist"></div>
            <div id="album"></div>
            <div id="context"></div>
        </div>

        <div class="bar-row">
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Seek">
            <div class="times"><span id="t-pos">0:00</span><span id="t-dur">0:00</span></div>
        </div>

        <div class="controls">
            <button id="btn-shuffle" class="toggle" title="Shuffle">&#128256;</button>
            <button id="btn-prev" title="Previous">&#9198;</button>
            <button id="btn-play" title="Play / pause">&#9654;</button>
            <button id="btn-next" title="Next">&#9197;</button>
            <button id="btn-repeat" class="toggle" title="Repeat: off">&#128257;</button>
        </div>

        <div class="vol-row">
            <span>&#128266;</span>
            <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
            <span id="vol-val">80</span>
        </div>
    </section>

    <aside>
        <h2>Up next</h2>
        <div id="queue"><div class="empty">Queue is empty.</div></div>
        <div class="uri-box">
            <input type="text" id="uri" placeholder="spotify:track:… / album / playlist URI" spellcheck="false" autocomplete="off">
            <div class="row">
                <button id="btn-play-uri" class="primary">Play</button>
                <button id="btn-queue-uri">Queue</button>
            </div>
        </div>
    </aside>
</main>

<footer>
    <span id="msg">Connecting…</span>
    <a href="/soloist/status" target="_blank" rel="noopener">daemon status</a>
</footer>

<script src="js/spotify.js"></script>
<script src="js/soloist-dashboard.js"></script>
</body>
</html>
